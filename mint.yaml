version: 1
name: Toast
slug: toast
summary: >-
  Find restaurants that take orders through Toast near you and read their
  online or full register menus, through your own browser via the ContextMint
  Bridge extension.
examples:
  - prompt: >-
      Which restaurants near 35.2271, -80.8431 can I order takeout from on
      Toast right now?
    note: Searches Toast's directory around the point, nearest first.
  - prompt: >-
      What vegetarian options are on the menu at
      https://order.toasttab.com/online/<restaurant>?
    note: Resolves the link to a restaurant, then searches its menu. Read-only.
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches Toast through the user's tab via the
# fetchproxy bridge. A bridged registration also needs runtime `fly-shared`,
# `bridge: true` and a `bridgePortEnv` (TOAST_WS_PORT), set over the control
# API. `state.dataDir` below is required for `bridge`.
env:
  - name: TOAST_WS_PORT
    required: false
    help: >-
      Concentrator port for the fetchproxy browser bridge (defaults to the
      fleet-shared 37149). The runner injects a per-registration port for a
      hosted bridged child, so this is the name to give bridgePortEnv.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser.
egress:
  # The process dials no public host: ws-api/order.toasttab.com are fetched by
  # the user's tab; the process only listens on the loopback bridge port.
  allow: []
